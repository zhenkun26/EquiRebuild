# Gateway + dashboard deployments. Replace <YOUR_REGISTRY> before applying.
# For reproducible deploys, pin the image by digest instead of a mutable tag:
#   image: <YOUR_REGISTRY>/hermes-agent@sha256:<YOUR_DIGEST>
# Both pods mount the SAME shared PVC (deploy/08-pvc.yaml): the dashboard
# reads the ~/.hermes state that the gateway writes. emptyDir is per-pod and
# silently breaks that sharing — do not revert to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: gateway
spec:
  # Session state lives in pod-local SQLite on the shared PVC; the gateway
  # cannot scale horizontally until state moves to an external store.
  replicas: 1
  strategy:
    # Recreate: two gateways must never write the same SQLite state at once.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
        app.kubernetes.io/component: gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: gateway
          image: <YOUR_REGISTRY>/hermes-agent:v0.20.0
          imagePullPolicy: IfNotPresent
          command: ["gateway", "run"]
          ports:
            - name: api
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: hermes-config
            # NOT optional: a missing Secret must fail fast at pod start
            # instead of letting the gateway run without credentials.
            - secretRef:
                name: hermes-secret
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          # API server is off by default; enable API_SERVER_KEY + API_SERVER_HOST
          # in the Secret/ConfigMap before uncommenting the tcpSocket probe.
          # readinessProbe:
          #   tcpSocket:
          #     port: api
          #   initialDelaySeconds: 10
          #   periodSeconds: 10
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
        app.kubernetes.io/component: dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: dashboard
          image: <YOUR_REGISTRY>/hermes-agent:v0.20.0
          imagePullPolicy: IfNotPresent
          # Bind 0.0.0.0 inside the pod; the Service/Ingress gate access.
          command: ["dashboard", "--host", "0.0.0.0", "--no-open"]
          ports:
            - name: http
              containerPort: 9119
          envFrom:
            - configMapRef:
                name: hermes-config
            - secretRef:
                name: hermes-secret
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
