# Single-replica gateway: minAvailable: 1 would BLOCK voluntary eviction
# (kubectl drain) forever, so use maxUnavailable: 1 — maintenance may take
# the gateway down briefly, which is the honest trade-off at replicas: 1.
# Raise replicas (only after state moves off pod-local SQLite) before using
# minAvailable.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-pdb
  namespace: hermes
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
      app.kubernetes.io/component: gateway
