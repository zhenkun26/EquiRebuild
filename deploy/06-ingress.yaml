# TLS/domain placeholders — replace <YOUR_DOMAIN> before applying.
#
# The dashboard stores API keys, so TLS alone is NOT enough: the basic-auth
# annotations below gate it behind credentials. Create the auth secret first:
#   htpasswd -c auth <YOUR_USERNAME>
#   kubectl -n hermes create secret generic hermes-dashboard-auth --from-file=auth
# Without that Secret, nginx answers 503 — fail-closed, never fail-open.
# For stronger setups, swap basic-auth for oauth2-proxy / VPN-only ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: dashboard
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: hermes-dashboard-auth
    nginx.ingress.kubernetes.io/auth-realm: "hermes dashboard"
spec:
  ingressClassName: nginx
  rules:
    - host: <YOUR_DOMAIN>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  name: http
  tls:
    - hosts:
        - <YOUR_DOMAIN>
      secretName: hermes-tls
