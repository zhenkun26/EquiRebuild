# TLS/domain placeholders — replace <YOUR_DOMAIN> before applying.
# The dashboard stores API keys: keep it behind auth or a VPN, not public.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboard
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: dashboard
spec:
  ingressClassName: nginx
  rules:
    - host: <YOUR_DOMAIN>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  name: http
  tls:
    - hosts:
        - <YOUR_DOMAIN>
      secretName: hermes-tls
