apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: dashboard
spec:
  selector:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: 9119
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: hermes
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: gateway
  ports:
    - name: api
      port: 8000
      targetPort: api
