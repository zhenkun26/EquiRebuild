name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project with dev dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/bin/python -e '.[dev]'

      - name: Lint (ruff)
        run: .venv/bin/python -m ruff check hermes-skills tests

      - name: Unit tests
        run: .venv/bin/python -m pytest tests/ -q

      - name: Coverage (>=80%)
        run: |
          .venv/bin/python -m coverage run -m pytest tests/ -q
          .venv/bin/python -m coverage report

      - name: Dogfood scan (fixtures must produce findings, exit 1)
        run: |
          set +e
          # --no-config: the repo-level .hardening-scan.toml exempts fixtures
          # for the full-repo scan; the dogfood step must bypass that exemption.
          .venv/bin/hardening-scan --no-config tests/skills/fixtures/
          code=$?
          set -e
          test "$code" -eq 1

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Kubernetes manifests (kubeval-style)
        uses: instrumenta/kubeval-action@master
        with:
          files: deploy/
